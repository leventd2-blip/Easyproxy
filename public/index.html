<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Proxy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #111827;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #1f2937;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { color: #38bdf8; margin-top: 0; font-size: 1.8rem; }
        p { color: #9ca3af; font-size: 0.95rem; margin-bottom: 1.5rem; }
        input {
            width: 100%;
            padding: 0.85rem;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #030712;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 1.0rem;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            background: #38bdf8;
            color: #030712;
            border: none;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: #0ea5e9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Web Proxy</h1>
        <p>Type a URL or search term, just like CroxyProxy.</p>
        <input type="text" id="userInput" placeholder="Enter URL or search query..." autocomplete="off">
        <button onclick="handleProxy()">Browse / Search</button>
    </div>

    <script>
        function handleProxy() {
            let input = document.getElementById('userInput').value.trim();
            if (!input) return;

            let targetUrl = '';
            // If it has a dot and no spaces, or starts with http, treat it as a website URL
            if (input.startsWith('http://') || input.startsWith('https://') || (input.includes('.') && !input.includes(' '))) {
                targetUrl = input.startsWith('http') ? input : 'https://' + input;
            } else {
                // Otherwise, treat it as a search query using DuckDuckGo's proxy-friendly HTML version
                targetUrl = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
            }

            window.location.href = '/proxy?url=' + encodeURIComponent(targetUrl);
        }
    </script>
</body>
</html>
