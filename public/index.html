<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Web Proxy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #111827;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #1f2937;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { color: #38bdf8; margin-top: 0; font-size: 1.8rem; }
        p { color: #9ca3af; font-size: 0.95rem; margin-bottom: 1.5rem; }
        input {
            width: 100%;
            padding: 0.85rem;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #030712;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            background: #38bdf8;
            color: #030712;
            border: none;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: #0ea5e9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Web Proxy</h1>
        <p>Enter any URL to load it through your proxy.</p>
        <div style="display: flex; flex-direction: column;">
            <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off">
            <button onclick="launchProxy()">Launch Proxy</button>
        </div>
    </div>

    <script>
        function launchProxy() {
            let target = document.getElementById('urlInput').value.trim();
            if (!target) {
                alert('Please enter a website URL!');
                return;
            }
            if (!target.startsWith('http://') && !target.startsWith('https://')) {
                target = 'https://' + target;
            }
            // Explicitly force JavaScript navigation to the proxy route
            window.location.href = '/proxy?url=' + encodeURIComponent(target);
        }
    </script>
</body>
</html>
